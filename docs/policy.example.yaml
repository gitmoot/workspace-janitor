# workspace-janitor policy
#
# Copy to $XDG_CONFIG_HOME/workspace-janitor/policy.yaml (by default
# ~/.config/workspace-janitor/policy.yaml) and validate with:
#
#   janitor policy check
#
# Unknown fields are rejected, so a typo fails loudly instead of silently
# disabling a protection. Omitted keys keep their built-in default; a key you
# write is used exactly as written, including a zero, which then has to pass
# validation.

version: 1

# Discovery roots. Every scan starts here and never leaves a root's
# filesystem unless cross_filesystem is set.
roots:
  - path: ~/repos
    max_depth: 2
    follow_symlinks: false
    cross_filesystem: false
    # report_only keeps a root in the inventory but bars any mutating action.
    report_only: false

# Protections are additive: these entries are added to the built-in ones
# (credential directories and secret-shaped filenames), never replace them.
protect:
  paths:
    - /srv/data
  name_patterns:
    - "*.backup"

retention:
  # How long quarantined items are kept: none, 7d, 30d, 90d, or permanent.
  # Expiry alone never deletes anything; a second safety evaluation must pass.
  default: 30d
  # Defaults to <state-dir>/quarantine. Wherever it points, it is added to
  # protect.paths automatically: the janitor never acts on its own staging area.
  quarantine_dir: ~/.local/state/workspace-janitor/quarantine
  # Off by default. Even when enabled, deletion requires an expired receipt,
  # a fresh complete safety evaluation, and a separate confirmed apply --expire.
  delete_enabled: false

# Background prevention is read-only by default. Generate user units with
# janitor service generate; this file never installs or starts them.
prevention:
  # The daily timer calls janitor cycle. After a successful scheduled deep
  # scan, another is due seven days later; watch events stay metadata-only.
  # This scheduled pass runs deep_size even if collectors.deep_size is false;
  # that flag only controls ad-hoc scans. Omit the timer to avoid deep cycles.
  deep_interval: 168h
  # Alert if either non-zero bound is crossed; zero disables that bound.
  min_free_bytes: 0
  min_free_percent: 10
  alert_interval: 24h
  # Requires retention.delete_enabled too. Expiry still uses the confirmed
  # apply path and a fresh, complete second safety observation.
  auto_expire: false

# Where entries of a class are supposed to live. A primary project found
# outside its canonical root is a relocation candidate, never a deletion
# candidate.
canonical_roots:
  - class: primary_project
    path: ~/repos

# Name-based signals for the built-in classifications. Each list is matched
# against the base name.
classification:
  # project_markers are literal file names, not patterns: each is checked
  # with a single lstat so a default scan stays metadata-only. A glob here
  # is rejected rather than silently ignored.
  project_markers: [".git", "go.mod", "package.json", "Cargo.toml", "pyproject.toml"]
  worktree_markers: ["*-wt-*", "*.worktree", "worktrees"]
  generated_names: ["node_modules", "dist", "build", "target", ".venv", "__pycache__", ".next"]
  cache_names: [".cache", "*-cache", ".uv-cache", ".gradle", ".pytest_cache"]
  backup_names: ["*.bak", "*-backup", "backup", "backups", "*.tar.gz", "*.zip"]
  operational_names: [".gitmoot", "fleet-tools", ".ssh", ".config"]
  evidence_names: ["evidence", "receipts", "incidents", "*-evidence"]

ownership:
  # Entries owned by another user go to investigate rather than to any
  # mutating action.
  investigate_foreign_owner: true
  # 0 means "do not check ownership".
  expected_uid: 0

# Gitmoot's managed home and ledger. The ledger is read-only to janitor;
# managed paths are never candidates for generic quarantine or deletion.
# A missing or uncertain ledger protects them rather than proving them idle.
gitmoot:
  home: ~/.gitmoot
  database: ~/.gitmoot/gitmoot.db

# Known regenerable caches. action is one of keep, quarantine,
# delete_candidate, or investigate (the default when omitted).
caches:
  - name: go-build
    path: ~/.cache/go-build
    action: delete_candidate
    retention: 30d
    # Optional bounds: a size bound acts only when exceeded, and ttl requires
    # the newest content to be old enough. Both need scan --deep-size.
    # max_bytes: 10737418240
    # ttl: 720h
  # Official pruning is separate, irreversible, Linux-only, and requires a
  # dedicated, idle cache with an exact approved delete_candidate action.
  # Set the real absolute executable path on this host; preview with
  # janitor apply --prune --action <id> before confirming it.
  # - name: uv-dedicated
  #   path: ~/.cache/uv
  #   action: delete_candidate
  #   dedicated: true
  #   official_binary: /usr/bin/uv

# The Jev model classifier is optional and disabled by default: the tool must
# be fully useful with no credentials and no network. When enabled, only
# entries the rules left ambiguous are sent, as a redacted allowlisted
# projection, and advice is applied only when it is safer than the rules.
jev:
  enabled: false
  model: typesafe/jev-1.13
  # Hosted calls go only to OpenRouter's System One endpoint. Loopback
  # HTTP is accepted for isolated fake-server tests.
  endpoint: https://openrouter.ai/api/v1/systemone
  # The NAME of the environment variable holding the OpenRouter key.
  # The key itself never belongs in a policy file or debug output.
  api_key_env: OPENROUTER_API_KEY
  # Entries per request, and the token budget for one request's state.
  max_batch: 20
  max_state_tokens: 24000
  timeout: 20s
  # Retries apply to 429, 529, 5xx, timeouts, and transport errors only.
  max_retries: 2
  min_interval: 100ms
  # Consecutive failed requests before the run stops calling the model.
  breaker_failures: 3
  # Answers below min_confidence, or judged unsafe above max_unsafe,
  # become investigate.
  min_confidence: 0.7
  max_unsafe: 0.2
  # USD per million input tokens, for the recorded cost estimate.
  price_per_mtok_usd: 0.042
  # How long a cached answer for an unchanged entry is reused.
  cache_ttl: 720h
  # Path segments redacted before anything is sent to a model. Protected
  # name patterns and secret-looking segments are always redacted.
  redact_segments:
    - secrets
    - credentials

# Which collectors run, and where the reference collectors look. Every
# location is explicit so a scan can be pointed at a fixture tree.
collectors:
  # Deep sizing is opt-in: the default scan is a top-level metadata pass.
  deep_size: false
  git: true
  processes: true
  services: true
  proc_root: /proc
  systemd_dirs:
    - /etc/systemd/system
    - /usr/lib/systemd/system
    - ~/.config/systemd/user
  cron_paths:
    - /etc/crontab
    - /etc/cron.d
  pm2_dumps:
    - ~/.pm2/dump.pm2

# Destination checks of the safety engine. Nothing here disables a core
# invariant: the protections themselves are not configurable.
safety:
  # Headroom that must remain on the destination filesystem after a
  # quarantine.
  min_free_bytes: 1073741824
  # The v0.1 action engine rejects cross-filesystem quarantine even if this
  # planner option is enabled; no verified copy mode is implemented.
  allow_cross_filesystem_quarantine: false

# Bounds that keep one slow repository or one enormous directory from
# stalling or unbounding a scan. Hitting a bound is reported as partial, not
# hidden.
limits:
  git_timeout: 5s
  command_timeout: 10s
  max_entries: 20000
  max_dir_entries: 5000
  deep_size_max_entries: 200000
  deep_size_max_depth: 16
