name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: format, vet, build, test, release-readiness (linux)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -v ./...

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # PR checks exercise GitHub's merge ref above; artifacts must instead
      # identify and reproduce the submitted full head, not that temporary ref.
      - name: checkout exact candidate head for artifact
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: verify candidate source identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: build and verify reproducible static linux/amd64 artifact
        run: make release-linux-amd64

      - name: smoke test the binary
        run: |
          ./dist/janitor-linux-amd64 --help
          ./dist/janitor-linux-amd64 version

      - name: prove rolling alias contract
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/jev-proof-state
        run: |
          GOBIN="$RUNNER_TEMP/proof-bin" go install github.com/gitmoot/test-check/cmd/test-check@d5f169ab623e8ba0896b727a09f36738612a79e2
          "$RUNNER_TEMP/proof-bin/test-check" prove --base origin/main --json --test "go test -p 1 ./internal/config ./internal/jev ./internal/cli -v -count=1 -run '^{name}$'" > dist/jev-proof.json
          cp -r "$XDG_STATE_HOME/test-check/receipts" dist/jev-receipts

      - name: upload release-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: janitor-linux-amd64
          path: |
            dist/janitor-linux-amd64
            dist/SHA256SUMS
            dist/jev-*
          if-no-files-found: error
