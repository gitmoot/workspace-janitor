name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: format, vet, build, test, release-readiness (linux)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -v ./...

      # The bind-mount supersede regression needs root in a private mount
      # namespace; under plain go test it skips, so run it here and fail
      # unless it actually ran and passed.
      - name: supersede bind-mount regression (root, private mount namespace)
        run: |
          # The default run shell has no pipefail: without it the test
          # binary's exit status would be lost in the pipe to tee.
          set -o pipefail
          go test -c -o "$RUNNER_TEMP/action.test" ./internal/action
          cd "$RUNNER_TEMP"
          sudo unshare -m ./action.test -test.run '^TestExpiryRefusesAnOriginalShowingTheCopy$' -test.v -test.count=1 | tee bind-mount.log
          if grep -q -- '--- SKIP' bind-mount.log; then
            echo "the bind-mount regression was skipped"
            exit 1
          fi
          grep -q -- '^--- PASS: TestExpiryRefusesAnOriginalShowingTheCopy' bind-mount.log

      - name: go test -race (watcher goroutines)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -run 'Watch' ./internal/cli

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # PR checks exercise GitHub's merge ref above; artifacts must instead
      # identify and reproduce the submitted full head, not that temporary ref.
      - name: checkout exact candidate head for artifact
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: verify candidate source identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: build and verify reproducible static linux/amd64 artifact
        run: make release-linux-amd64

      - name: smoke test the binary
        run: |
          ./dist/janitor-linux-amd64 --help
          ./dist/janitor-linux-amd64 version

      - name: upload release-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: janitor-linux-amd64
          path: |
            dist/janitor-linux-amd64
            dist/SHA256SUMS
          if-no-files-found: error
