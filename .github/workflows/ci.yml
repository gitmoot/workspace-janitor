name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: format, vet, build, test (linux)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: build release binary
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/gitmoot/workspace-janitor/internal/buildinfo.version=ci-${GITHUB_SHA::12}" \
            -o dist/janitor ./cmd/janitor

      - name: verify the binary is static
        run: |
          file dist/janitor
          if file dist/janitor | grep -q 'dynamically linked'; then
            echo "release binary must be statically linked (CGO_ENABLED=0)"
            exit 1
          fi

      - name: smoke test the binary
        run: |
          ./dist/janitor --help
          ./dist/janitor version

      - name: go test
        run: go test ./...

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
