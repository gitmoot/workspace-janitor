name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: format, vet, build, test, release-readiness (linux)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: build and verify reproducible static linux/amd64 artifact
        run: make release-linux-amd64

      - name: smoke test the binary
        run: |
          ./dist/janitor-linux-amd64 --help
          ./dist/janitor-linux-amd64 version

      - name: go test
        run: go test ./...

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: upload release-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: janitor-linux-amd64
          path: |
            dist/janitor-linux-amd64
            dist/SHA256SUMS
          if-no-files-found: error
