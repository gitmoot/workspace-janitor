name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: format, vet, build, test, release-readiness (linux)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -v ./...

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # PR checks exercise GitHub's merge ref above; artifacts must instead
      # identify and reproduce the submitted full head, not that temporary ref.
      - name: checkout exact candidate head for artifact
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: verify candidate source identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: build and verify reproducible static linux/amd64 artifact
        run: make release-linux-amd64

      - name: smoke test the binary
        run: |
          ./dist/janitor-linux-amd64 --help
          ./dist/janitor-linux-amd64 version

      # Temporary exact-head evidence for #70; removed after receipts are saved.
      - name: prove reporting regressions on old and new code
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/capacity-proof-state
        run: |
          GOBIN="$RUNNER_TEMP/proof-bin" go install github.com/gitmoot/test-check/cmd/test-check@d5f169ab623e8ba0896b727a09f36738612a79e2
          set +e
          "$RUNNER_TEMP/proof-bin/test-check" prove --base origin/main --json --test "go test -p 1 ./internal/cli ./internal/store -v -count=1 -run '^{name}$'" > dist/capacity-proof-output.json
          code=$?
          set -e
          test "$code" = 0 || test "$code" = 4
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          receipts = list(Path(os.environ["XDG_STATE_HOME"]).glob("test-check/receipts/*/receipt.json"))
          assert len(receipts) == 1, receipts
          receipt = json.loads(receipts[0].read_text())
          proven = {
              "TestInventoryGrowthKeepsDeepBaselineAcrossMetadataScans",
              "TestInventoryGrowthDoesNotTurnIncompleteTreesIntoZero",
              "TestInventoryGrowthRejectsChangedPolicyScope",
              "TestCapacityHistoryDistinguishesArchiveExpiryAndReplay",
              "TestScanHistoryKeepsAuditReferencesAndLastDeep",
              "TestScanHistoryPinsSubsecondDeepCompletion",
          }
          guards = {"TestCycleMigratesPreviousSchemaBeforeCheckingDeepCadence", "TestCycleWholeWorktreeContentsPolicy"}
          outcomes = {test["name"]: test["outcome"] for test in receipt["tests"]}
          assert proven <= outcomes.keys(), outcomes
          assert all(outcomes[name] == "proven" for name in proven), outcomes
          assert all(outcome == "proven" or (name in guards and outcome == "not_red_on_old") for name, outcome in outcomes.items()), outcomes
          shutil.copyfile(receipts[0], "dist/capacity-proof-receipt.json")
          shutil.copyfile(receipt["output_ref"], "dist/capacity-proof-detail.json")
          print(json.dumps(outcomes, indent=2))
          PY

      - name: exercise real reporting and archive CLI
        run: |
          python3 scripts/capacity-reporting-smoke.py ./dist/janitor-linux-amd64 dist/capacity-reporting-smoke.json
          python3 scripts/capacity-archive-smoke.py ./dist/janitor-linux-amd64 dist/capacity-archive-smoke.json

      - name: upload release-readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: janitor-linux-amd64
          path: |
            dist/janitor-linux-amd64
            dist/SHA256SUMS
            dist/capacity-*.json
          if-no-files-found: error
